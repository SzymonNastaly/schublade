name: Check

on:
  push:
    branches: [main]
    # Markdown outside the website changes no checked code; the website validates its posts at build.
    paths: ["**", "!**/*.md", "public_website/**"]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The website is a package of its own, not a workspace member: cf refuses to build a workspace root.
      - run: pnpm --dir public_website install --frozen-lockfile --ignore-workspace
      # Kept out of pnpm check, which must stay fast before every push.
      - run: pnpm website:check
