name: Collector

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "test_fixtures/collection_corpus/**"
      # candidate_classification compares its leading-byte signatures with this file.
      - "src/ingestion/source_file.ts"
      - ".github/workflows/collector.yml"

concurrency:
  group: collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        include:
          # The Tauri app links WebKit and builds only on macOS; Linux checks the core and the program.
          - os: ubuntu-latest
            members: ""
          - os: macos-latest
            members: --workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: collector
      - run: cargo fmt --check
      - run: cargo clippy ${{ matrix.members }} --all-targets --locked -- -D warnings
      - run: cargo test ${{ matrix.members }} --locked

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector/collection_interface
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: collector/collection_interface/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: collector/collection_interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
