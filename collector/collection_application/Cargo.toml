[package]
name = "collection_application"
description = "Schublade Collector, the macOS app over the collector core"
version.workspace = true
edition.workspace = true
# Tauri 2.12 requires Rust 1.90.
rust-version = "1.90"
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
collection_core = { path = "../collection_core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"
