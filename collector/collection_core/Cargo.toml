[package]
name = "collection_core"
description = "The state machines, persistence, and archive client of the Schublade collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
unicode-normalization = "=0.1.26"
