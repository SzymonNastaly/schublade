[package]
name = "application_bindings"
description = "The Schublade application as a native interface sees it: one root, library, collector, listings, published statuses, and refusals exported through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The static library is what an application links. The rlib is what `cargo test` runs.
crate-type = ["staticlib", "lib"]

[dependencies]
archive_access = { path = "../archive_access" }
archive_replica = { path = "../archive_replica" }
# Runs each blocking call of the core on a thread of its own pool, so the thread that polls an
# exported future never waits.
blocking = "=1.7.0"
collection_core = { path = "../collection_core" }
event-listener = "=5.4.2"
# Proc macros in library mode. `application_bindings_generator` pins the same version.
uniffi = "=0.32.2"

[dev-dependencies]
pollster = "=1.0.3"
scripted_archive = { path = "../scripted_archive" }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
