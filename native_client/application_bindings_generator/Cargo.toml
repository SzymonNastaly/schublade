[package]
name = "application_bindings_generator"
description = "uniffi-bindgen-swift for application_bindings, in its own crate so that its command-line dependencies stay out of the static library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
