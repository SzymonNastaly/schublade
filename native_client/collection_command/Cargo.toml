[package]
name = "collection_command"
description = "schublade-collector, the command-line program of the Schublade collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "schublade-collector"
path = "src/main.rs"

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
archive_access = { path = "../archive_access" }
collection_core = { path = "../collection_core" }
# The JPEG encoder of the first page's picture, the version pdfium-render draws into.
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
# Binds the PDFium library at run time; `pdfium_document_reader.rs` says where it looks.
pdfium-render = "=0.9.6"
serde_json = "=1.0.154"
