[package]
name = "collection_core"
description = "The state machines, persistence, and archive client of the Schublade collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
archive_access = { path = "../archive_access" }
notify = "=8.2.2"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"

[dev-dependencies]
tempfile = "=3.27.0"
tiny_http = "=0.12.0"
