# XcodeGen writes Schublade.xcodeproj from this file on every script run, and git ignores
# the project.
name: Schublade
options:
  deploymentTarget:
    # Control Center and Lock Screen controls exist from iOS 18.
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: configuration/signing.xcconfig
  Release: configuration/signing.xcconfig
settings:
  base:
    # Every name a person sees derives from this name and the two bundle identifiers below.
    APPLICATION_DISPLAY_NAME: Schublade
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/generated_bindings/foreign_function_interface
    # The Rust library of the platform being built: the device or the simulator.
    RUST_TARGET_DIRECTORY[sdk=iphoneos*]: $(SRCROOT)/../target/aarch64-apple-ios/$(CARGO_PROFILE_DIRECTORY)
    RUST_TARGET_DIRECTORY[sdk=iphonesimulator*]: $(SRCROOT)/../target/aarch64-apple-ios-sim/$(CARGO_PROFILE_DIRECTORY)
    APPLICATION_BINDINGS_LINKER_FLAGS: >-
      -lapplication_bindings -framework Security -framework CoreFoundation -framework CoreServices
      -framework SystemConfiguration -liconv -Wl,-fatal_warnings
    # The application and its share extension share the submissions in this App Group and the token
    # in this Keychain access group. A build without a team has no prefix.
    SHARED_APPLICATION_GROUP: group.$(APPLICATION_BUNDLE_IDENTIFIER)
    SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)$(APPLICATION_BUNDLE_IDENTIFIER)
  configs:
    Debug:
      APPLICATION_PRODUCT_NAME: $(APPLICATION_DISPLAY_NAME) Development
      APPLICATION_BUNDLE_IDENTIFIER: org.schublade.iphone.development
      CARGO_PROFILE: dev
      CARGO_PROFILE_DIRECTORY: debug
    Release:
      APPLICATION_PRODUCT_NAME: $(APPLICATION_DISPLAY_NAME)
      APPLICATION_BUNDLE_IDENTIFIER: org.schublade.iphone
      CARGO_PROFILE: release
      CARGO_PROFILE_DIRECTORY: release

targets:
  ApplicationBindings:
    type: library.static
    platform: iOS
    sources:
      - path: generated_bindings/application_bindings.swift
        optional: true
        buildPhase: sources
    preBuildScripts:
      - name: Produce the application bindings
        script: '"$SRCROOT/../scripts/produce_application_bindings.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/generated_bindings/application_bindings.swift
          - $(SRCROOT)/generated_bindings/foreign_function_interface/application_bindingsFFI.h
          - $(SRCROOT)/generated_bindings/foreign_function_interface/module.modulemap
    settings:
      base:
        # The generated Swift does not compile with MainActor default isolation, and a module of
        # one file is otherwise parsed as a script.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        OTHER_SWIFT_FLAGS: -parse-as-library
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  SubmissionQueue:
    type: library.static
    platform: iOS
    sources: [submission_queue]
    dependencies:
      - target: ApplicationBindings
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  # The pending scan request that the intent and the quick action raise and the submissions screen
  # answers, in a module of its own because the controls extension compiles the intent too.
  ScanRequest:
    type: library.static
    platform: iOS
    sources: [scan_request]
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  ApplicationInterface:
    type: library.static
    platform: iOS
    sources: [application_interface]
    dependencies:
      - target: SubmissionQueue
      - target: ApplicationBindings
      - target: ScanRequest
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  Schublade:
    type: application
    platform: iOS
    sources:
      # The drawing is the source of the icon, not a resource of the bundle.
      - path: application
        excludes: ["*.svg", "*.entitlements"]
      - scan_document_intent
    dependencies:
      - target: ApplicationInterface
      - target: SubmissionQueue
      - target: ApplicationBindings
      - target: ScanRequest
      - target: ShareExtension
      - target: ControlExtension
    info:
      path: application/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A phone application in portrait, which the system allows only for one that fills the screen.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: $(APPLICATION_DISPLAY_NAME) scans letters and receipts with the camera and sends them to your archive.
        # The type is ScanRequestCenter.quickActionType.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: scan-document
            UIApplicationShortcutItemTitle: Scan Document
            UIApplicationShortcutItemIconSymbolName: doc.viewfinder
        # SharedInstallation reads these, in the application and the share extension alike.
        SchubladeApplicationBundleIdentifier: $(APPLICATION_BUNDLE_IDENTIFIER)
        SchubladeApplicationGroup: $(SHARED_APPLICATION_GROUP)
        SchubladeKeychainAccessGroup: $(SHARED_KEYCHAIN_ACCESS_GROUP)
    settings:
      base:
        PRODUCT_NAME: $(APPLICATION_PRODUCT_NAME)
        CODE_SIGN_ENTITLEMENTS: application/Schublade.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Schublade
        # The website's blue tints every control, as on the Mac.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LIBRARY_SEARCH_PATHS: $(RUST_TARGET_DIRECTORY)
        OTHER_LDFLAGS: $(APPLICATION_BINDINGS_LINKER_FLAGS)

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: share_extension
        excludes: ["*.entitlements"]
    dependencies:
      - target: SubmissionQueue
      - target: ApplicationBindings
    info:
      path: share_extension/Info.plist
      properties:
        CFBundleDisplayName: $(APPLICATION_PRODUCT_NAME)
        SchubladeApplicationBundleIdentifier: $(APPLICATION_BUNDLE_IDENTIFIER)
        SchubladeApplicationGroup: $(SHARED_APPLICATION_GROUP)
        SchubladeKeychainAccessGroup: $(SHARED_KEYCHAIN_ACCESS_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A share item of at most 20 files, the archive's limit per upload, with a PDF or a picture
            # among them. The share sheet never offers an extension whose rule holds BETWEEN, although
            # NSPredicate evaluates it.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, $extensionItem.attachments.@count <= 20
              AND SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER).share-extension
        CODE_SIGN_ENTITLEMENTS: share_extension/ShareExtension.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LIBRARY_SEARCH_PATHS: $(RUST_TARGET_DIRECTORY)
        OTHER_LDFLAGS: $(APPLICATION_BINDINGS_LINKER_FLAGS)

  # The Control Center and Lock Screen control, the one SwiftUI target. It holds no App Group and no
  # Keychain access group, because the intent it runs only opens the application.
  ControlExtension:
    type: app-extension
    platform: iOS
    sources:
      - control_extension
      - scan_document_intent
    dependencies:
      - target: ScanRequest
    info:
      path: control_extension/Info.plist
      properties:
        CFBundleDisplayName: $(APPLICATION_PRODUCT_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: ControlExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER).controls

  ApplicationEndToEndTests:
    type: bundle.unit-test
    platform: iOS
    sources: [application_end_to_end_tests]
    dependencies:
      - target: Schublade
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER).application-end-to-end-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APPLICATION_PRODUCT_NAME).app/$(APPLICATION_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Schublade:
    build:
      targets:
        Schublade: all
        ApplicationEndToEndTests: [test]
    test:
      config: Debug
      targets: [ApplicationEndToEndTests]
      environmentVariables:
        SCHUBLADE_APPLICATION_ENVIRONMENT: isolated
