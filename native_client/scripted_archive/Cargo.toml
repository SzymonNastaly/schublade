[package]
name = "scripted_archive"
description = "One in-process and HTTP archive model behind both the library and collector protocols for scenarios and end-to-end tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scripted-archive-server"
path = "src/bin/scripted_archive_server/main.rs"

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
libc = "=0.2.191"
archive_access = { path = "../archive_access" }
archive_replica = { path = "../archive_replica" }
collection_core = { path = "../collection_core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tiny_http = "=0.12.0"

[dev-dependencies]
tempfile = "=3.27.0"
ureq = "=3.5.2"
