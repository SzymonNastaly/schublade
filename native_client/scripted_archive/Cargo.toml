[package]
name = "scripted_archive"
description = "An archive in memory that keeps records and a change journal by the server's rules, for the scenarios of the local copy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
archive_access = { path = "../archive_access" }
archive_replica = { path = "../archive_replica" }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
