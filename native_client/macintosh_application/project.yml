# XcodeGen writes Schublade.xcodeproj from this file on every script run, and git ignores
# the project.
name: Schublade
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Sparkle updates the Release application from the appcast on schublade.org. Its version changes together
# with the one scripts/fetch_sparkle_tools.sh fetches.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
configFiles:
  Debug: configuration/signing.xcconfig
  Release: configuration/signing.xcconfig
settings:
  base:
    # Every name a person sees derives from this name and the two bundle identifiers below.
    APPLICATION_DISPLAY_NAME: Schublade
    # The version the About panel shows, in the scheme of the iPhone application.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/generated_bindings/foreign_function_interface
  configs:
    Debug:
      APPLICATION_PRODUCT_NAME: $(APPLICATION_DISPLAY_NAME) Development
      APPLICATION_BUNDLE_IDENTIFIER: org.schublade.application.development
      CARGO_PROFILE: dev
      CARGO_PROFILE_DIRECTORY: debug
    Release:
      APPLICATION_PRODUCT_NAME: $(APPLICATION_DISPLAY_NAME)
      APPLICATION_BUNDLE_IDENTIFIER: org.schublade.application
      CARGO_PROFILE: release
      CARGO_PROFILE_DIRECTORY: release

targets:
  ApplicationBindings:
    type: library.static
    platform: macOS
    sources:
      - path: generated_bindings/application_bindings.swift
        optional: true
        buildPhase: sources
    preBuildScripts:
      - name: Produce the application bindings
        script: '"$SRCROOT/../scripts/produce_application_bindings.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/generated_bindings/application_bindings.swift
          - $(SRCROOT)/generated_bindings/foreign_function_interface/application_bindingsFFI.h
          - $(SRCROOT)/generated_bindings/foreign_function_interface/module.modulemap
    settings:
      base:
        # The generated Swift does not compile with MainActor default isolation, and a module of
        # one file is otherwise parsed as a script.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        OTHER_SWIFT_FLAGS: -parse-as-library
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  LibraryPresentation:
    type: library.static
    platform: macOS
    sources: [../library_presentation]
    dependencies:
      - target: ApplicationBindings
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  # Foundation, PDFKit, Vision, and ImageIO only, so that the iPhone application can build it too.
  DocumentReading:
    type: library.static
    platform: macOS
    sources: [../document_reading]
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  ApplicationPresentation:
    type: library.static
    platform: macOS
    sources: [application_presentation]
    dependencies:
      - target: LibraryPresentation
      - target: ApplicationBindings
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  ApplicationInterface:
    type: library.static
    platform: macOS
    sources: [application_interface]
    dependencies:
      - target: DocumentReading
      - target: ApplicationPresentation
      - target: LibraryPresentation
      - target: ApplicationBindings
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  Schublade:
    type: application
    platform: macOS
    sources:
      # The drawings are sources, not resources of the bundle. AppIcon.icon, the Icon Composer
      # document of the icon's three layers, is one resource that the asset catalogue compiler turns
      # into the icon of macOS 26 and the flattened icon of macOS 14 and 15.
      - path: application
        excludes: ["*.svg"]
    dependencies:
      - target: ApplicationInterface
      - target: DocumentReading
      - target: ApplicationPresentation
      - target: LibraryPresentation
      - target: ApplicationBindings
      - package: Sparkle
    info:
      path: application/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSPrincipalClass: NSApplication
        NSDownloadsFolderUsageDescription: &folder_usage_description
          $(APPLICATION_DISPLAY_NAME) uploads the PDFs and images in the folders you add to your Schublade archive.
        NSDesktopFolderUsageDescription: *folder_usage_description
        NSDocumentsFolderUsageDescription: *folder_usage_description
        NSNetworkVolumesUsageDescription: *folder_usage_description
        NSRemovableVolumesUsageDescription: *folder_usage_description
        # The appcast lists each release's disk image on GitHub with the EdDSA signature that
        # sign_update made with the private half of this key, which only the Mac's build account holds.
        SUFeedURL: https://schublade.org/mac/appcast.xml
        SUPublicEDKey: ckfLzcn983vJXaWFh87JG01cxxkkE34TdL58NGSEZTc=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_NAME: $(APPLICATION_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Schublade
        # The website's blue tints native controls while the system accent is Multicolor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-darwin/$(CARGO_PROFILE_DIRECTORY)
        # Security for the Keychain store, CoreServices for FSEvents. A linker warning fails the
        # build, so a Rust object built for a newer system than the deployment target does too.
        OTHER_LDFLAGS: >-
          -lapplication_bindings -framework Security -framework CoreFoundation -framework CoreServices -liconv
          -Wl,-fatal_warnings

  ApplicationPresentationTests:
    type: bundle.unit-test
    platform: macOS
    sources: [application_presentation_tests, ../library_presentation_tests, ../document_reading_tests]
    dependencies:
      - target: DocumentReading
      - target: ApplicationPresentation
      - target: LibraryPresentation
      - target: ApplicationBindings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER).application-presentation-tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-darwin/$(CARGO_PROFILE_DIRECTORY)
        OTHER_LDFLAGS: >-
          -lapplication_bindings -framework Security -framework CoreFoundation -framework CoreServices -liconv
          -Wl,-fatal_warnings

  ApplicationEndToEndTests:
    type: bundle.unit-test
    platform: macOS
    sources: [application_end_to_end_tests]
    dependencies:
      - target: Schublade
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLICATION_BUNDLE_IDENTIFIER).application-end-to-end-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APPLICATION_PRODUCT_NAME).app/Contents/MacOS/$(APPLICATION_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

  InterfaceRenderer:
    type: tool
    platform: macOS
    sources: [interface_renderer]
    dependencies:
      - target: ApplicationInterface
      - target: DocumentReading
      - target: ApplicationPresentation
      - target: LibraryPresentation
      - target: ApplicationBindings
    settings:
      base:
        PRODUCT_NAME: InterfaceRenderer
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-darwin/$(CARGO_PROFILE_DIRECTORY)
        OTHER_LDFLAGS: >-
          -lapplication_bindings -framework Security -framework CoreFoundation -framework CoreServices -liconv
          -Wl,-fatal_warnings

schemes:
  Schublade:
    build:
      targets:
        ApplicationPresentation: all
        Schublade: all
        InterfaceRenderer: all
        ApplicationPresentationTests: [test]
        ApplicationEndToEndTests: [test]
    test:
      config: Debug
      targets: [ApplicationPresentationTests, ApplicationEndToEndTests]
      environmentVariables:
        SCHUBLADE_APPLICATION_ENVIRONMENT: isolated
