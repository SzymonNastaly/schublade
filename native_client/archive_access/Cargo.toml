[package]
name = "archive_access"
description = "What every client of one Schublade archive shares: the address, the token and its storage, the HTTP exchange, and the conditions of an answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every version is an exact pin, and Cargo.lock is committed, so each machine builds the same code.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
ureq = "=3.5.2"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

# The iPhone's Keychain item lives in an access group that the share extension shares, which
# keyring cannot name.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
